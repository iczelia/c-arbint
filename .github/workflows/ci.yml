          arch="x86"
          export CC="${{ matrix.compiler }}"

          configure_args="--disable-dependency-tracking"
          if [ "${{ matrix.lto }}" = "on" ]; then
            configure_args="$configure_args --enable-lto=yes"
          else
            configure_args="$configure_args --enable-lto=no"
          fi

          if [ "${{ matrix.tune }}" = "on" ]; then
            configure_args="$configure_args --with-base-optimization=tuned"
          else
            configure_args="$configure_args --with-base-optimization=default"
          fi

          tarball="$(ls dist/*.tar.xz | sed -n '1p')"
          srcdir="$(tar -tf "$tarball" 2>/dev/null | sed -n '1p' | cut -d/ -f1)"
          tar -xf "$tarball" -C dist
          cd "dist/$srcdir"
          jobs="$(nproc 2>/dev/null || echo 2)"

          if [ "${{ matrix.compiler }}" = "tcc" ]; then
            tcc_root="$PWD/.tinycc-$arch"
            tcc_src_dir="$tcc_root/tcc-0.9.27"
            tcc_prefix="$tcc_root/prefix"
            rm -rf "$tcc_root"
            mkdir -p "$tcc_root"
            tcc_archive="$tcc_root/tcc-0.9.27.tar.bz2"
            tcc_url_primary="https://download-mirror.savannah.gnu.org/releases/tinycc/tcc-0.9.27.tar.bz2"
            tcc_url_fallback="https://download-mirror.savannah.nongnu.org/releases/tinycc/tcc-0.9.27.tar.bz2"
            if ! curl -fsSL --retry 3 --retry-delay 2 -o "$tcc_archive" "$tcc_url_primary"; then
              curl -fsSL --retry 3 --retry-delay 2 -o "$tcc_archive" "$tcc_url_fallback"
            fi
            echo "de23af78fca90ce32dff2dd45b3432b2334740bb9bb7b05bf60fdbfc396ceb9c  $tcc_archive" | sha256sum -c -
            tar -xf "$tcc_archive" -C "$tcc_root"
            cd "$tcc_src_dir"
            tcc_cpu="i386"
            ./configure --prefix="$tcc_prefix" --cpu="$tcc_cpu" --config-mingw32
            make -j"$jobs"
            make install
            export PATH="$tcc_prefix/bin:$tcc_src_dir:$PATH"
            cd ../..

            tcc_bin=""
            if [ -x "$tcc_prefix/bin/tcc.exe" ]; then
              tcc_bin="$tcc_prefix/bin/tcc.exe"
            elif [ -x "$tcc_prefix/bin/tcc" ]; then
              tcc_bin="$tcc_prefix/bin/tcc"
            elif [ -x "$tcc_src_dir/tcc.exe" ]; then
              tcc_bin="$tcc_src_dir/tcc.exe"
            elif [ -x "$tcc_src_dir/tcc" ]; then
              tcc_bin="$tcc_src_dir/tcc"
            fi

            if [ -z "$tcc_bin" ]; then
              echo "Unable to locate tcc executable after TinyCC install." >&2
              exit 1
            fi

            tcc_runtime="$(find "$tcc_root" -type f -name 'libtcc1.a' | sed -n '1p')"
            if [ -z "$tcc_runtime" ]; then
              echo "Unable to locate libtcc1.a after TinyCC install." >&2
              exit 1
            fi
            tcc_libdir="$(dirname "$tcc_runtime")"
            tcc_runtime_root="$(dirname "$tcc_libdir")"
            tcc_base_root="$tcc_runtime_root"
            case "$tcc_libdir" in
              */lib/tcc)
                tcc_base_root="$(dirname "$(dirname "$tcc_libdir")")"
                ;;
              */lib)
                tcc_base_root="$(dirname "$tcc_libdir")"
                ;;
            esac
            tcc_base_lib="$tcc_base_root/lib"
            echo "Using libtcc1 runtime: $tcc_runtime"
            echo "Using TinyCC base root: $tcc_base_root"
            tcc_wrapper="$tcc_root/tcc-driver.sh"
            printf '%s\n' '#!/usr/bin/env bash' \
              'set -euo pipefail' \
              'args=()' \
              'while [ "$#" -gt 0 ]; do' \
              '  if [ "$1" = "-link" ] && [ "${2-}" = "-dll" ]; then' \
              '    args+=("-shared")' \
              '    shift 2' \
              '    continue' \
              '  fi' \
              '  args+=("$1")' \
              '  shift' \
              'done' \
              "exec \"$tcc_bin\" -B\"$tcc_base_root\" -L\"$tcc_base_root\" -L\"$tcc_base_lib\" -L\"$tcc_libdir\" \"\${args[@]}\"" \
              > "$tcc_wrapper"
            chmod +x "$tcc_wrapper"
            export CC="$tcc_wrapper"
            tcc_internal_cppflags=""
            if [ -d "$tcc_libdir/include" ]; then
              tcc_internal_cppflags="$tcc_internal_cppflags -I$tcc_libdir/include"
            fi
            if [ -d "$tcc_base_root/include" ]; then
              tcc_internal_cppflags="$tcc_internal_cppflags -I$tcc_base_root/include"
            fi
            export CPPFLAGS="${CPPFLAGS:-}$tcc_internal_cppflags"
            export LDFLAGS="${LDFLAGS:-} -L$tcc_base_root -L$tcc_base_lib -L$tcc_libdir"
            tcc_include_path=""
            if [ -d "$tcc_base_root/include" ]; then
              tcc_include_path="$tcc_base_root/include"
            fi
            if [ -d "$tcc_libdir/include" ]; then
              if [ -n "$tcc_include_path" ]; then
                tcc_include_path="$tcc_include_path:$tcc_libdir/include"
              else
                tcc_include_path="$tcc_libdir/include"
              fi
            fi
            if [ -n "$tcc_include_path" ]; then
              export C_INCLUDE_PATH="$tcc_include_path${C_INCLUDE_PATH:+:$C_INCLUDE_PATH}"
            fi
            export LIBRARY_PATH="$tcc_base_root:$tcc_base_lib:$tcc_libdir${LIBRARY_PATH:+:$LIBRARY_PATH}"
          fi

          dump_logs_on_failure() {
            rc="$?"
            if [ "$rc" -ne 0 ]; then
              set +e
              for f in configure.log make.log check.log config.log config.status tests/test-suite.log; do
                if [ -f "$f" ]; then
                  echo "===== $f ====="
                  tail -n 300 "$f" || true
                fi
              done
            fi
          }
          trap dump_logs_on_failure EXIT

          "$CC" -v || true
          ./configure $configure_args 2>&1 | tee configure.log
          make -j"$jobs" 2>&1 | tee make.log
          echo "=== Contents of src/.libs ==="
          ls -la src/.libs/ || true
          if [ "${{ matrix.compiler }}" = "tcc" ]; then
            dll_path="$(ls src/.libs/libarbint-*.dll 2>/dev/null | sed -n '1p')"
            if [ -n "$dll_path" ] && [ ! -f src/.libs/libarbint.lib ]; then
              cp "$dll_path" src/.libs/libarbint.lib
            fi
            test_bins_raw="$(awk '
              BEGIN { collecting=0; line="" }
              /^check_PROGRAMS[[:space:]]*=/ {
                collecting=1
                sub(/^[^=]*=[[:space:]]*/, "", $0)
              }
              collecting {
                gsub(/[[:space:]]+$/, "", $0)
                if (line != "") line = line " "
                line = line $0
                if ($0 ~ /\\$/) {
                  sub(/\\$/, "", line)
                  next
                }
                print line
                exit
              }
            ' tests/Makefile)"
            exeext="$(sed -n 's/^EXEEXT = //p' tests/Makefile | sed -n '1p')"
            test_bins="$(printf '%s\n' "$test_bins_raw" | awk -v e="$exeext" '{ gsub(/\$\(EXEEXT\)/, e); print }')"
            if [ -z "$test_bins" ]; then
              echo "Unable to resolve \$(check_PROGRAMS) from tests/Makefile" | tee -a check.log
              exit 1
            fi
            make -C tests -j"$jobs" $test_bins 2>&1 | tee check.log
            export PATH="$PWD/src/.libs:$PWD/tests/.libs:$PATH"
            for test_name in $test_bins; do
              test_bin="tests/.libs/${test_name}"
              if [ ! -x "$test_bin" ]; then
                test_bin="tests/.libs/${test_name%.exe}"
              fi
              echo "Running $test_bin" | tee -a check.log
              "$test_bin" 2>&1 | tee -a check.log
            done
          else
            make check 2>&1 | tee check.log
          fi

      - name: Copy artifacts to upload directory
        if: matrix.compiler != 'tcc' && matrix.tune == 'off'
        shell: msys2 {0}
        run: |
          mkdir -p artifacts
          find dist -name "*.dll" | xargs -I {} cp {} artifacts/ || true
          ls -la artifacts/

      - name: Upload DLL artifacts
        if: matrix.compiler != 'tcc' && matrix.tune == 'off'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-mingw-x86-${{ matrix.compiler }}-lto${{ matrix.lto }}
          path: artifacts/*
          if-no-files-found: warn

  build-windows-msvc:
    runs-on: windows-latest
    needs: package
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        lto: ['on']
    name: build-windows-msvc (${{ matrix.arch }}, lto-${{ matrix.lto }})

    steps:
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Setup MSYS2 tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            make
            tar
            xz
            groff
            pkgconf

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: c-arbint-dist
          path: dist

      - name: Extract, build, and test (MSVC)
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          set -euo pipefail

          export CC=cl
          export CL="${CL:-} -nologo"

          configure_args="--disable-dependency-tracking --with-base-optimization=default --enable-shared --disable-static"
          if [ "${{ matrix.lto }}" = "off" ]; then
            configure_args="$configure_args --enable-lto=no"
          else
            configure_args="$configure_args --enable-lto=auto"
          fi
          configure_args="$configure_args --enable-warnings"

          tarball="$(ls dist/*.tar.xz | sed -n '1p')"
          srcdir="$(tar -tf "$tarball" 2>/dev/null | sed -n '1p' | cut -d/ -f1)"
          tar -xf "$tarball" -C dist
          cd "dist/$srcdir"
          jobs="$(nproc 2>/dev/null || echo 2)"

          dump_logs_on_failure() {
            rc="$?"
            if [ "$rc" -ne 0 ]; then
              set +e
              for f in configure.log make.log check.log config.log config.status tests/test-suite.log; do
                if [ -f "$f" ]; then
                  echo "===== $f ====="
                  tail -n 300 "$f" || true
                fi
              done
            fi
          }
          trap dump_logs_on_failure EXIT

          command -v "$CC" >/dev/null 2>&1 || {
            echo "MSVC compiler '$CC' not found on PATH" >&2
            exit 1
          }

          "$CC" -Bv || true
          if ! ./configure $configure_args 2>&1 | tee configure.log; then
            if [ -f config.log ]; then
              echo "===== config.log ====="
              tail -n 500 config.log || true
            fi
            exit 1
          fi
          make -j"$jobs" 2>&1 | tee make.log
          make check 2>&1 | tee check.log
          echo "=== Contents of src/.libs ==="
          ls -la src/.libs/ || true

      - name: Copy artifacts to upload directory
        shell: msys2 {0}
        run: |
          mkdir -p artifacts
          find dist -name "*.dll" | xargs -I {} cp {} artifacts/ || true
          ls -la artifacts/

      - name: Upload DLL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-msvc-${{ matrix.arch }}-lto${{ matrix.lto }}
          path: artifacts/*
          if-no-files-found: warn

  build-exotic-arch:
    runs-on: ubuntu-latest
    needs: package
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, s390x, ppc64le]
        compiler: [gcc, clang]
        lto: ['on', 'off']
        exclude:
          # Compiler segfaults on these configurations
          - arch: ppc64le
            compiler: gcc
          - arch: s390x
            compiler: gcc
          - arch: riscv64
            compiler: clang
            lto: 'on'
    name: build-exotic (${{ matrix.arch }}, ${{ matrix.compiler }}, lto-${{ matrix.lto }})

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: c-arbint-dist
          path: dist

      - name: Build and test on ${{ matrix.arch }}
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu_latest
          githubToken: ${{ github.token }}

          install: |
            apt-get update -q -y
            apt-get install -q -y build-essential clang pkg-config tar xz-utils groff

          run: |
            set -eu

            export CC="${{ matrix.compiler }}"

            configure_args=""
            if [ "${{ matrix.lto }}" = "on" ]; then
              configure_args="$configure_args --enable-lto=yes"
            else
              configure_args="$configure_args --enable-lto=no"
            fi

            tarball="$(ls dist/*.tar.xz | head -n1)"
            srcdir="$(tar -tf "$tarball" 2>/dev/null | head -n1 | cut -d/ -f1)"
            tar -xf "$tarball" -C dist
            cd "dist/$srcdir"
            ./configure $configure_args
            jobs="$(nproc 2>/dev/null || echo 2)"
            make -j"$jobs"
            make check
            echo "=== Contents of src/.libs ==="
            ls -la src/.libs/ || true

      - name: Copy artifacts to upload directory
        run: |
          mkdir -p artifacts
          find dist -name "*.so" -o -name "*.so.*" | xargs -I {} cp {} artifacts/ || true
          ls -la artifacts/

      - name: Upload shared library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-exotic-${{ matrix.arch }}-${{ matrix.compiler }}-lto${{ matrix.lto }}
          path: artifacts/*
          if-no-files-found: warn

  build-macos:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        lto: ['on', 'off']
        tune: ['on', 'off']
    runs-on: macos-15
    name: build-macos (arm64, lto-${{ matrix.lto }}, tune-${{ matrix.tune }})

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: c-arbint-dist
          path: dist

      - name: Extract, build, and test
        run: |
          export CC=clang

          configure_args=""
          if [ "${{ matrix.lto }}" = "on" ]; then
            configure_args="$configure_args --enable-lto=yes"
          else
            configure_args="$configure_args --enable-lto=no"
          fi

          if [ "${{ matrix.tune }}" = "on" ]; then
            configure_args="$configure_args --with-base-optimization=tuned"
          else
            configure_args="$configure_args --with-base-optimization=default"
          fi

          tarball="$(ls dist/*.tar.xz | head -n1)"
          srcdir="$(tar -tf "$tarball" 2>/dev/null | head -n1 | cut -d/ -f1)"
          tar -xf "$tarball" -C dist
          cd "dist/$srcdir"
          ./configure $configure_args
          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 3)"
          make -j"$jobs"
          make check
          echo "=== Contents of src/.libs ==="
          ls -la src/.libs/ || true

      - name: Copy artifacts to upload directory
        if: matrix.tune == 'off'
        run: |
          mkdir -p artifacts
          find dist -name "*.dylib" | xargs -I {} cp {} artifacts/ || true
          ls -la artifacts/

      - name: Upload shared library artifacts
        if: matrix.tune == 'off'
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-arm64-lto${{ matrix.lto }}
          path: artifacts/*
          if-no-files-found: warn

  build-wasm:
    runs-on: ubuntu-24.04
    needs: package
    strategy:
      fail-fast: false
      matrix:
        mode: [wasm32, wasm64]
        lto: ['on', 'off']
    name: build-wasm (${{ matrix.mode }}, lto-${{ matrix.lto }})

    steps:
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: c-arbint-dist
          path: dist

      - name: Extract, build, and test
        run: |
          tarball="$(ls dist/*.tar.xz | head -n1)"
          srcdir="$(tar -tf "$tarball" 2>/dev/null | head -n1 | cut -d/ -f1)"
          tar -xf "$tarball" -C dist
          cd "dist/$srcdir"

          # Build shared only; configure detects emscripten and sets up
          # libtool patches (SIDE_MODULE), test flags (MAIN_MODULE +
          # NODERAWFS), and test runner (run_wasm_test.sh).
          configure_args="--enable-shared --disable-static"
          if [ "${{ matrix.lto }}" = "on" ]; then
            configure_args="$configure_args --enable-lto=yes"
          else
            configure_args="$configure_args --enable-lto=no"
          fi

          em_cflags=""
          em_ldflags=""
          host_triple="wasm32-unknown-emscripten"
          if [ "${{ matrix.mode }}" = "wasm64" ]; then
            host_triple="wasm64-unknown-emscripten"
            em_cflags="-sMEMORY64"
            em_ldflags="-sMEMORY64"
          elif [ "${{ matrix.mode }}" = "asmjs" ]; then
            em_cflags="-sWASM=0"
            em_ldflags="-sWASM=0"
          fi
          configure_args="$configure_args --host=$host_triple"

          emconfigure ./configure $configure_args \
            CFLAGS="${CFLAGS:-} $em_cflags" \
            LDFLAGS="${LDFLAGS:-} $em_ldflags"
          emmake make -j"$(nproc)"

          echo "=== Library ==="
          file src/.libs/libarbint.so || true
          ls -la src/.libs/libarbint.so || true

          echo "=== Running tests ==="
          emmake make check || {
            echo "=== Test suite log ==="
            cat tests/test-suite.log 2>/dev/null || true
            exit 1
          }

      - name: Copy artifacts to upload directory
        run: |
          mkdir -p artifacts
          find dist -name "*.wasm" -path "*/src/.libs/*" | xargs -I {} cp {} artifacts/ || true
          find dist -name "*.so" -path "*/src/.libs/*" -type f | xargs -I {} cp {} artifacts/ || true
          ls -la artifacts/

      - name: Upload library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-wasm-${{ matrix.mode }}-lto${{ matrix.lto }}
          path: artifacts/*
          if-no-files-found: warn

  repack-artifacts:
    runs-on: ubuntu-24.04
    needs: [build-ubuntu, build-linux-x86-32, build-windows-mingw-64, build-windows-mingw-32, build-windows-msvc, build-exotic-arch, build-macos, build-wasm]
    if: always()

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: build-*

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find all-artifacts -type f -ls

      - name: Rename and organize binaries
        run: |
          mkdir -p binaries

          # Function to map artifact names to tuple-compiler format
          rename_binary() {
            local artifact_name="$1"
            local file="$2"
            local filename=$(basename "$file")

            # Determine file extension (handle .so, .so.*, .dylib, .dll, .wasm)
            local ext=""
            if [[ "$filename" =~ \.so(\.[0-9]+)*$ ]]; then
              ext="so"
            elif [[ "$filename" =~ \.dylib$ ]]; then
              ext="dylib"
            elif [[ "$filename" =~ \.dll$ ]]; then
              ext="dll"
            elif [[ "$filename" =~ \.wasm$ ]]; then
              ext="wasm"
            else
              echo "Warning: Unknown file extension: $filename"
              return 1
            fi

            # Extract platform, compiler, and lto status
            local tuple=""
            local compiler=""
            local lto_suffix=""

            # Parse artifact name: build-{platform}-{arch}-{compiler}-lto{on|off}
            # Examples:
            #   build-linux-x86-64-gcc-ltoon -> amd64-linux-lg
            #   build-linux-arm64-clang-ltooff -> arm64-linux-c
            #   build-windows-msvc-x64-ltoauto -> amd64-windows-m

            # Note: x86-64 needs escaping because of the hyphen in the arch name
            if [[ "$artifact_name" =~ ^build-linux-x86-64-([^-]+)-lto(on|off|auto)$ ]]; then
              tuple="amd64-linux"
              compiler="${BASH_REMATCH[1]}"
              lto="${BASH_REMATCH[2]}"
            elif [[ "$artifact_name" =~ ^build-linux-arm64-([^-]+)-lto(on|off|auto)$ ]]; then
              tuple="arm64-linux"
              compiler="${BASH_REMATCH[1]}"
              lto="${BASH_REMATCH[2]}"
            elif [[ "$artifact_name" =~ ^build-linux-x86-32-i386-([^-]+)-lto(on|off|auto)$ ]]; then
              tuple="i386-linux"
              compiler="${BASH_REMATCH[1]}"
              lto="${BASH_REMATCH[2]}"
            elif [[ "$artifact_name" =~ ^build-exotic-ppc64le-([^-]+)-lto(on|off|auto)$ ]]; then
              tuple="ppc64le-linux"
              compiler="${BASH_REMATCH[1]}"
              lto="${BASH_REMATCH[2]}"
            elif [[ "$artifact_name" =~ ^build-exotic-riscv64-([^-]+)-lto(on|off|auto)$ ]]; then
              tuple="rv64gc-linux"
              compiler="${BASH_REMATCH[1]}"
              lto="${BASH_REMATCH[2]}"
            elif [[ "$artifact_name" =~ ^build-exotic-s390x-([^-]+)-lto(on|off|auto)$ ]]; then
              tuple="s390x-linux"
              compiler="${BASH_REMATCH[1]}"
              lto="${BASH_REMATCH[2]}"
            elif [[ "$artifact_name" =~ ^build-macos-arm64-lto(on|off|auto)$ ]]; then
              tuple="arm64-darwin"
              compiler="clang"
              lto="${BASH_REMATCH[1]}"
            elif [[ "$artifact_name" =~ ^build-windows-mingw-x86_64-([^-]+)-lto(on|off|auto)$ ]]; then
              tuple="amd64-windows"
              compiler="${BASH_REMATCH[1]}"
              lto="${BASH_REMATCH[2]}"
            elif [[ "$artifact_name" =~ ^build-windows-mingw-x86-([^-]+)-lto(on|off|auto)$ ]]; then
              tuple="i386-windows"
              compiler="${BASH_REMATCH[1]}"
              lto="${BASH_REMATCH[2]}"
            elif [[ "$artifact_name" =~ ^build-windows-msvc-x64-lto(on|off|auto)$ ]]; then
              tuple="amd64-windows"
              compiler="msvc"
              lto="${BASH_REMATCH[1]}"
            elif [[ "$artifact_name" =~ ^build-windows-msvc-x86-lto(on|off|auto)$ ]]; then
              tuple="i386-windows"
              compiler="msvc"
              lto="${BASH_REMATCH[1]}"
            elif [[ "$artifact_name" =~ ^build-wasm-(wasm32|wasm64|asmjs)-lto(on|off)$ ]]; then
              tuple="${BASH_REMATCH[1]}-emscripten"
              compiler="emcc"
              lto="${BASH_REMATCH[2]}"
            else
              echo "Warning: Unable to parse artifact name: $artifact_name"
              return 1
            fi

            # Map compiler names to suffixes
            case "$compiler" in
              gcc) compiler="g" ;;
              clang) compiler="c" ;;
              msvc) compiler="m" ;;
              emcc) compiler="e" ;;
              *) echo "Warning: Unknown compiler: $compiler"; return 1 ;;
            esac

            # Add 'l' prefix for LTO builds
            if [[ "$lto" == "on" || "$lto" == "auto" ]]; then
              lto_suffix="l"
            fi

            # Construct new filename: libarbint-{tuple}-{lto_suffix}{compiler}.{ext}
            local new_name="libarbint-${tuple}-${lto_suffix}${compiler}.${ext}"
            echo "$new_name"
          }

          # Process all binaries
          declare -A file_map  # Map from checksum to chosen filename

          for artifact_dir in all-artifacts/build-*; do
            if [ -d "$artifact_dir" ]; then
              artifact_name=$(basename "$artifact_dir")

              for file in "$artifact_dir"/*; do
                if [ -f "$file" ]; then
                  # Only process library files
                  case "$file" in
                    *.so|*.so.*|*.dylib|*.dll|*.wasm)
                      new_name=$(rename_binary "$artifact_name" "$file")
                      if [ $? -eq 0 ] && [ -n "$new_name" ]; then
                        checksum=$(sha256sum "$file" | awk '{print $1}')

                        # Check for duplicates
                        if [ -n "${file_map[$checksum]:-}" ]; then
                          existing="${file_map[$checksum]}"
                          echo "Duplicate found: $new_name (same as $existing, skipping)"
                        else
                          cp "$file" "binaries/$new_name"
                          file_map[$checksum]="$new_name"
                          echo "Renamed: $artifact_name/$(basename "$file") -> $new_name"
                        fi
                      fi
                      ;;
                  esac
                fi
              done
            fi
          done

          echo "=== Final binaries ==="
          ls -lh binaries/

          # Create xz tarball
          tar -cJf c-arbint-binaries.tar.xz -C binaries .

          echo "=== Created archive ==="
          ls -lh c-arbint-binaries.tar.xz

      - name: Upload repacked archive
        uses: actions/upload-artifact@v4
        with:
          name: c-arbint-binaries-repacked
          path: c-arbint-binaries.tar.xz
          if-no-files-found: error
